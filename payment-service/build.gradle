plugins {
    id 'org.springframework.boot' version '3.5.7'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
    id "org.openapi.generator" version "7.12.0"
}

group = 'yandex.workshop'
version = '0.0.1-SNAPSHOT'
description = 'payment-service'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()

}

dependencies {
    // Spring
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'com.fasterxml.jackson.module:jackson-module-parameter-names'

    // Open API
    implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui:2.8.13'
    implementation 'org.openapitools:jackson-databind-nullable:0.2.5'

    // Spring Security and OAuth2
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    // Util
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

openApiGenerate {
    generatorName.set("spring")
    inputSpec.set("$rootDir/openapi/payment-api.yaml")
    outputDir.set("$projectDir/build/generated")
    modelPackage.set("yandex.workshop.payment.model")
    apiPackage.set("yandex.workshop.payment.api")
    invokerPackage.set("yandex.workshop.payment.invoker")
    configOptions.set([
            interfaceOnly: "true",
            useTags: "true",
            reactive: "true",
            dateLibrary: "java8",
            useReactive: "true",
            useSpringBoot3: "true"
    ])
}

// Добавляем сгенерированные источники в sourceSet, чтобы Gradle их компилировал
sourceSets {
    main {
        java {
            srcDirs += "$buildDir/generated/src/main/java"
        }
    }
}


// Генерация кода при сборке
tasks.named('compileJava') {
    dependsOn tasks.named('openApiGenerate')
}

bootJar {
    archiveFileName = 'payment-service.jar'
}
