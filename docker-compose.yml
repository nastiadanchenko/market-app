version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: market
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7.4.2-bookworm
    ports: ["6379:6379"]

  payment-service:
    image: yourrepo/payment-service:latest
    build:
      context: .
      dockerfile: ./payment-service/Dockerfile
    environment:
      - SPRING_R2DBC_URL=r2dbc:postgresql://postgres:5432/market
      - SPRING_REDIS_HOST=redis
    ports: ["8081:8081"]
    depends_on:
      - postgres
      - redis

  market-app:
    image: yourrepo/market-app:latest
    build:
      context: .
      dockerfile: ./market-app/Dockerfile
    environment:
      - SPRING_R2DBC_URL=r2dbc:postgresql://postgres:5432/market
      - SPRING_REDIS_HOST=redis
      - PAYMENT_SERVICE_URL=http://payment-service:8081
    ports: ["8080:8080"]
    depends_on:
      - postgres
      - redis
      - payment-service

volumes:
  pgdata:
