plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.7'
    id "org.openapi.generator" version "7.12.0"
}

group = 'yandex.workshop'
version = '0.0.1-SNAPSHOT'
description = 'market-service'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // For reactive programming
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
    runtimeOnly 'io.r2dbc:r2dbc-postgresql:0.8.10.RELEASE'

//    runtimeOnly 'org.liquibase:liquibase-core'

    implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui:2.8.13'

    implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'
    implementation 'io.lettuce:lettuce-core'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'


    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation "org.testcontainers:r2dbc"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}


openApiGenerate {
    generatorName.set("java")
    inputSpec.set("$rootDir/openapi/payment-api.yaml")
    outputDir.set("$projectDir/build/generated")
    modelPackage.set("yandex.workshop.market.domain")
    apiPackage.set("yandex.workshop.market.api")
    configOptions.set([
            interfaceOnly: "true",
            library        : "webclient",
            useJakartaEe   : "true",
            openApiNullable: "false"
    ])
}

sourceSets {
    main {
        java {
            srcDirs += "$buildDir/generated/src/main/java"
        }
    }
}

openApiValidate {
    inputSpec.set("$rootDir/openapi/payment-api.yaml")
}

tasks.named('test') {
    useJUnitPlatform()
}


// Генерация кода при сборке
tasks.named('compileJava') {
    dependsOn tasks.named('openApiGenerate')
}

bootJar {
    archiveFileName = 'market-app.jar'
}

